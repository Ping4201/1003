<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暖暖家計簿</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <img src="images/logo.svg" alt="雙手捧著硬幣的圖示" class="logo">
    <div>
      <h1>暖暖家計簿</h1>
      <p class="sub">HOME LEDGER</p>
    </div>
    <button class="btn primary" id="addBtn">＋ 新增項目</button>
  </header>

  <main>
    <section class="cards" aria-label="總覽">
      <div class="card"><span>總資產</span><strong id="totalAsset">0</strong></div>
      <div class="card"><span>總負債</span><strong id="totalDebt">0</strong></div>
      <div class="card net"><span>淨資產</span><strong id="netWorth">0</strong></div>
    </section>

    <section class="charts">
      <div class="panel">
        <h2>資產分布</h2>
        <div id="donut" class="chart"></div>
        <ul id="legend" class="legend"></ul>
      </div>
      <div class="panel">
        <h2>淨資產趨勢</h2>
        <div id="trend" class="chart"></div>
      </div>
    </section>

    <section class="panel">
      <div class="list-head">
        <h2>我的項目</h2>
        <div class="tabs" id="tabs">
          <button data-filter="all" class="on">全部</button>
          <button data-filter="asset">資產</button>
          <button data-filter="debt">負債</button>
        </div>
      </div>
      <ul id="list" class="list"></ul>
      <div id="empty" class="empty" hidden>
        <p>還沒有任何項目喔～</p>
        <button class="btn" id="sampleBtn">載入範例資料看看</button>
      </div>
    </section>
  </main>

  <section class="backup">
    <p>⚠️ 資料只存在這台裝置的瀏覽器裡。清除瀏覽器資料或換裝置就會消失，請定期備份。</p>
    <div>
      <button class="btn" id="exportBtn">匯出備份</button>
      <button class="btn" id="importBtn">匯入備份</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>

  <footer>本工具僅供記帳參考，不構成理財建議。</footer>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h3 id="dlgTitle">新增項目</h3>
      <label>類型
        <select name="kind" id="kind">
          <option value="asset">資產</option>
          <option value="debt">負債</option>
        </select>
      </label>
      <label>名稱
        <input name="name" required maxlength="30" placeholder="例如：郵局活存">
      </label>
      <label>分類
        <select name="category" id="category"></select>
      </label>
      <label>金額（元）
        <input name="amount" type="number" min="0" max="1000000000000" step="1" required inputmode="numeric">
      </label>
      <label>備註（選填）
        <input name="note" maxlength="60">
      </label>
      <div class="actions">
        <button type="button" class="btn" id="cancelBtn">取消</button>
        <button type="submit" class="btn primary">儲存</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
